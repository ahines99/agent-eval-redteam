name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.12'}
          - {os: ubuntu-latest, python: '3.13'}
          - {os: ubuntu-latest, python: '3.14'}
          - {os: windows-latest, python: '3.12'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.12.18
      - run: uv sync --frozen --all-extras
      - run: uv run --frozen ruff check src tests migrations scripts
      - run: uv run --frozen mypy src
      - run: uv run --frozen pytest --cov --cov-report=term-missing --cov-report=xml --junitxml=data/verification/tests.xml
      - run: uv run --frozen python -m build --no-isolation
      - name: Verify installed wheel outside source tree
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/installed"
          uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/runtime.txt"
          if [ "$RUNNER_OS" = "Windows" ]; then PY="$RUNNER_TEMP/installed/Scripts/python.exe"; else PY="$RUNNER_TEMP/installed/bin/python"; fi
          "$PY" -m pip install --require-hashes -r "$RUNNER_TEMP/runtime.txt"
          "$PY" -m pip install --no-deps dist/*.whl
          "$PY" scripts/smoke_installed.py --output-dir data/verification/wheel
      - uses: actions/upload-artifact@v7
        with:
          name: verification-${{ matrix.os }}-${{ matrix.python }}
          path: |
            coverage.xml
            data/verification/
            dist/

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: eval
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: agent_eval_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://eval:local-ci-only@localhost:5432/agent_eval_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.18
      - run: uv sync --frozen --all-extras
      - run: uv run --frozen pytest tests/test_delivery.py tests/test_postgres_contracts.py -m postgres -v --junitxml=data/verification/postgres.xml

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t agent-eval-ci .
      - run: docker run --rm --entrypoint python agent-eval-ci scripts/smoke_installed.py
      - run: docker compose config --quiet
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.18
      - run: uv sync --frozen --all-extras
      - run: docker compose build
      - run: docker compose run --rm --entrypoint alembic eval upgrade head
      - run: uv run --frozen python scripts/mcp_walkthrough.py --container --output-dir data/verification/compose
      - uses: actions/upload-artifact@v7
        with:
          name: compose-verification
          path: data/verification/compose/
      - if: always()
        run: docker compose down --volumes
