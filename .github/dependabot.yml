version: 2
updates:
  - package-ecosystem: uv
    directory: /
    open-pull-requests-limit: 1
    groups:
      maintenance:
        patterns: ["*"]
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 1
    groups:
      maintenance:
        patterns: ["*"]
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    open-pull-requests-limit: 1
    groups:
      maintenance:
        patterns: ["*"]
    schedule:
      interval: weekly
